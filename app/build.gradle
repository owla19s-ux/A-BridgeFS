plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.abridgefs.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abridgefs.app'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("A_BRIDGEFS_KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("A_BRIDGEFS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("A_BRIDGEFS_KEY_ALIAS")
                keyPassword System.getenv("A_BRIDGEFS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
