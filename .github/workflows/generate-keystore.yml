name: Generate Android Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -storetype JKS \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Android, OU=Dev, O=Example, L=Guangzhou, ST=Guangdong, C=CN"

      - name: Base64 encode
        run: base64 -w0 my-release-key.jks > keystore.base64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            my-release-key.jks
            keystore.base64

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "keystore-${GITHUB_RUN_ID}" \
            my-release-key.jks keystore.base64 \
            --title "Keystore ${GITHUB_RUN_ID}" \
            --notes "自动生成的 Android 签名密钥。请下载并妥善保存，不要泄露。"