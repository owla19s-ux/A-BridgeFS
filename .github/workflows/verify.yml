name: Verify

on:
  push:
    branches: [architecture-rebuild]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android project
        run: ./gradlew testDebugUnitTest --stacktrace
