name: Android Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Building commit: $GITHUB_SHA"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare official signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_ALIAS}"

          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/a-bridgefs-release.jks"
          test -s "$RUNNER_TEMP/a-bridgefs-release.jks"

          echo "A_BRIDGEFS_KEYSTORE_FILE=$RUNNER_TEMP/a-bridgefs-release.jks" >> "$GITHUB_ENV"
          echo "A_BRIDGEFS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "A_BRIDGEFS_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "A_BRIDGEFS_KEY_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"

          mkdir -p release
          keytool -list -v \
            -keystore "$RUNNER_TEMP/a-bridgefs-release.jks" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            > /tmp/bridgefs-keytool.txt

          awk '/^Certificate fingerprints:/ {inside=1; next} inside && /^[[:space:]]*SHA256:/ {print; found=1; exit} END {if (!found) exit 1}' \
            /tmp/bridgefs-keytool.txt \
            > release/A-BridgeFS-signing-fingerprint.txt

          test -s release/A-BridgeFS-signing-fingerprint.txt
          cat release/A-BridgeFS-signing-fingerprint.txt

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" | tee /tmp/apk-certs.txt
          grep -F "Signer #1 certificate SHA-256 digest: 23:E8:5B:DB:18:CD:3B:47:24:B1:69:25:4E:E6:79:F1:0F:80:2D:CA:54:C4:1F:FA:77:04:34:96:1B:7A:F9:15" /tmp/apk-certs.txt

      - name: Prepare fixed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/A-BridgeFS.apk
          test -s release/A-BridgeFS.apk

      - name: Upload SHA-specific artifact
        uses: actions/upload-artifact@v4
        with:
          name: A-BridgeFS-${{ github.sha }}
          path: |
            release/A-BridgeFS.apk
            release/A-BridgeFS-signing-fingerprint.txt
          if-no-files-found: error

      - name: Publish latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release delete latest --cleanup-tag --yes || true

          gh release create latest \
            release/A-BridgeFS.apk \
            release/A-BridgeFS-signing-fingerprint.txt \
            --target "$GITHUB_SHA" \
            --title "A-BridgeFS latest" \
            --notes "Automatically published from commit $GITHUB_SHA."
